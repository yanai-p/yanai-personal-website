name: yanai-personal-preview

services:
  web:
    image: nginx:alpine
    ports:
      - "4173:80"
    volumes:
      - ./yanai-site/dist:/usr/share/nginx/html:ro
      - ./yanai-site/preview-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
